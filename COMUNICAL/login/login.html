<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - COMUNICAL</title>
  <link rel="stylesheet" href="./login.css">
  <script src="../auth.js" defer></script>
  <script src="./login.js" defer></script>
</head>

<body>
  <header class="top-bar">
    <h1>COMUNICAL</h1>
  </header>

  <main class="login-container">
    <section class="card" role="form" aria-labelledby="titulo-login">
      <h2 id="titulo-login">Entrar</h2>
      <p class="subtitle">Acesse para abrir seus eventos e tarefas.</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input id="email" type="email" required autocomplete="username" placeholder="seu@email.com">
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input id="senha" type="password" required autocomplete="current-password" placeholder="••••••••">
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="termos" required>
            <span>Aceito os termos de uso e política de privacidade</span>
          </label>
        </div>

        <div class="actions">
          <button class="btn btn-primary" type="submit">Entrar</button>
          <a class="link" href="#" id="ajudaLink">Precisa de ajuda?</a>
        </div>

        <p class="muted">* Validação local, sem servidor.</p>
      </form>
    </section>
  </main>
  
</body>
</html>
